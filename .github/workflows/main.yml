name: Build GKI 5.10 - MamboSU

on:
  workflow_dispatch:
    inputs:
      kernel_name:
        description: "Kernel name"
        required: true
        default: "Zixine"
        type: string

      kernel_branch:
        description: "Kernel branch"
        required: true
        default: "android12-5.10"
        type: string

      ksuversion:
        description: "KernelSU branch"
        required: true
        default: "xxksu"
        type: string

      hz:
        description: "Kernel HZ"
        required: true
        default: "500"
        type: choice
        options:
          - "250"
          - "300"
          - "500"
          - "1000"

jobs:
  build:
    name: Build GKI ARM64
    runs-on: ubuntu-22.04

    permissions:
      contents: write

    env:
      KERNEL_REPO: https://github.com/ramabondanp/android_kernel_common-5.10
      KSU_REPO: https://github.com/RapliVx/KernelSU

      KERNEL_DIR: ${{ github.workspace }}/kernel
      OUT_DIR: ${{ github.workspace }}/out
      DIST_DIR: ${{ github.workspace }}/dist

    steps:

      # ------------------------------------------------------------
      # 1. Free runner storage
      # ------------------------------------------------------------
      - name: Free disk space
        run: |
          echo "=== DISK BEFORE ==="
          df -h

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo apt-get clean

          echo "=== DISK AFTER ==="
          df -h

      # ------------------------------------------------------------
      # 2. Install dependencies
      # ------------------------------------------------------------
      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            bc \
            bison \
            flex \
            build-essential \
            zip \
            unzip \
            rsync \
            cpio \
            libssl-dev \
            libelf-dev \
            pahole \
            python3 \
            python3-pip \
            python3-dev \
            lz4 \
            zstd \
            ccache

      # ------------------------------------------------------------
      # 3. Checkout kernel
      # ------------------------------------------------------------
      - name: Clone kernel source
        run: |
          git clone \
            --depth=1 \
            --branch "${{ inputs.kernel_branch }}" \
            "${KERNEL_REPO}" \
            "${KERNEL_DIR}"

          cd "${KERNEL_DIR}"

          echo "=== KERNEL SOURCE ==="
          git log -1 --oneline
          git branch --show-current

      # ------------------------------------------------------------
      # 4. Setup KernelSU / MamboSU
      # ------------------------------------------------------------
      - name: Add KernelSU MamboSU
        run: |
          cd "${KERNEL_DIR}"

          echo "Installing KernelSU branch:"
          echo "${{ inputs.ksuversion }}"

          curl -LSs \
            "https://raw.githubusercontent.com/RapliVx/KernelSU/xxksu/kernel/setup.sh" \
            | bash -s xxksu

          echo ""
          echo "=== KernelSU files ==="

          if [ -d "KernelSU" ]; then
            find KernelSU -maxdepth 2 -type f | head -50
          fi

          if [ -d "drivers/kernelsu" ]; then
            find drivers/kernelsu -maxdepth 2 -type f | head -50
          fi

      # ------------------------------------------------------------
      # 5. Prepare GKI configuration
      # ------------------------------------------------------------
      - name: Configure GKI
        run: |
          cd "${KERNEL_DIR}"

          export ARCH=arm64

          echo "=== Running GKI defconfig ==="

          make O="${OUT_DIR}" \
            ARCH=arm64 \
            gki_defconfig

          # --------------------------------------------------------
          # HZ = 500
          # --------------------------------------------------------
          ./scripts/config \
            --file "${OUT_DIR}/.config" \
            --enable CONFIG_HZ_500 \
            --set-val CONFIG_HZ 500

          # --------------------------------------------------------
          # KernelSU syscall hook requirements
          # --------------------------------------------------------
          ./scripts/config \
            --file "${OUT_DIR}/.config" \
            --enable CONFIG_KPROBES \
            --enable CONFIG_KRETPROBES \
            --enable CONFIG_HAVE_SYSCALL_TRACEPOINTS

          # --------------------------------------------------------
          # Save configuration
          # --------------------------------------------------------
          make O="${OUT_DIR}" \
            ARCH=arm64 \
            olddefconfig

          echo ""
          echo "=== IMPORTANT CONFIG ==="

          grep -E \
            'CONFIG_HZ(_500)?=|CONFIG_KPROBES=|CONFIG_KRETPROBES=|CONFIG_HAVE_SYSCALL_TRACEPOINTS=|CONFIG_KSU' \
            "${OUT_DIR}/.config" || true

      # ------------------------------------------------------------
      # 6. Build GKI
      # ------------------------------------------------------------
      - name: Build GKI kernel
        env:
          KBUILD_BUILD_USER: Zixine
          KBUILD_BUILD_HOST: GitHub-Actions
        run: |
          cd "${KERNEL_DIR}"

          export ARCH=arm64
          export SUBARCH=arm64

          echo "========================================"
          echo "      STARTING GKI KERNEL BUILD"
          echo "========================================"

          echo "Kernel : ${{ inputs.kernel_name }}"
          echo "Branch : ${{ inputs.kernel_branch }}"
          echo "KSU    : ${{ inputs.ksuversion }}"
          echo "HZ     : ${{ inputs.hz }}"

          echo ""
          echo "=== DISK BEFORE BUILD ==="
          df -h

          # Use the kernel's Android 12 GKI build configuration.
          LTO=thin \
          BUILD_CONFIG="${KERNEL_DIR}/build.config.gki.aarch64" \
          OUT_DIR="${OUT_DIR}" \
          DIST_DIR="${DIST_DIR}" \
          build/build.sh

      # ------------------------------------------------------------
      # 7. Verify output
      # ------------------------------------------------------------
      - name: Verify build output
        run: |
          echo "========================================"
          echo "          BUILD OUTPUT"
          echo "========================================"

          echo ""
          echo "=== DIST ==="
          find "${DIST_DIR}" -maxdepth 2 -type f -printf '%p\n' | sort || true

          echo ""
          echo "=== SEARCH KERNEL IMAGE ==="

          find "${DIST_DIR}" \
            -type f \
            \( \
              -name "Image" \
              -o -name "Image.gz" \
              -o -name "Image.lz4" \
              -o -name "boot.img" \
              -o -name "*.ko" \
            \) \
            -print || true

          echo ""
          echo "=== KERNEL VERSION ==="

          if [ -f "${DIST_DIR}/Image" ]; then
            file "${DIST_DIR}/Image"
          fi

      # ------------------------------------------------------------
      # 8. Package release
      # ------------------------------------------------------------
      - name: Package kernel
        run: |
          set -e

          DATE=$(date +"%Y%m%d-%H%M")
          ZIP_NAME="${{ inputs.kernel_name }}-GKI-5.10-MamboSU-${DATE}.zip"

          mkdir -p release

          # Copy complete GKI distribution
          cp -a "${DIST_DIR}/." release/

          # Add build information
          cat > release/BUILD_INFO.txt <<EOF
          Kernel Name : ${{ inputs.kernel_name }}
          Kernel Repo : ${KERNEL_REPO}
          Kernel Branch: ${{ inputs.kernel_branch }}

          KernelSU Repo: ${KSU_REPO}
          KernelSU Branch: ${{ inputs.ksuversion }}

          Architecture: arm64
          Kernel HZ: ${{ inputs.hz }}

          GitHub Run:
          ${GITHUB_RUN_NUMBER}

          Commit:
          $(cd "${KERNEL_DIR}" && git rev-parse HEAD)

          Build Date:
          $(date -u)
          EOF

          cd release

          zip -9 -r "../${ZIP_NAME}" .

          cd ..

          echo "PACKAGE=${ZIP_NAME}" >> "${GITHUB_ENV}"

          echo ""
          echo "=== PACKAGE ==="
          ls -lh "${ZIP_NAME}"

      # ------------------------------------------------------------
      # 9. Upload artifacts
      # ------------------------------------------------------------
      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.kernel_name }}-GKI-5.10-MamboSU
          path: |
            ${{ env.PACKAGE }}
            ${{ env.DIST_DIR }}/**
          if-no-files-found: error
          retention-days: 14

      # ------------------------------------------------------------
      # 10. GitHub Release
      # ------------------------------------------------------------
      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "GKI-5.10-${{ github.run_number }}"
          name: "${{ inputs.kernel_name }} GKI 5.10 MamboSU #${{ github.run_number }}"
          body: |
            ## ${{ inputs.kernel_name }} GKI 5.10

            **Kernel**
            - Source: ramabondanp/android_kernel_common-5.10
            - Branch: `${{ inputs.kernel_branch }}`
            - Architecture: ARM64

            **Root**
            - KernelSU fork: RapliVx/KernelSU
            - Branch: `${{ inputs.ksuversion }}`
            - MamboSU support: enabled

            **Configuration**
            - CONFIG_HZ: `${{ inputs.hz }}`
            - LTO: Thin

            **Build**
            - GitHub Run: `${{ github.run_number }}`
            - Commit: `${{ github.sha }}`

            > This is a GKI kernel build. Device-specific boot/vendor_boot
            > integration may still be required depending on the target device.

          files: |
            ${{ env.PACKAGE }}
          fail_on_unmatched_files: true
          generate_release_notes: true
