name: Build GKI 5.10 - MamboSU

on:
  workflow_dispatch:
    inputs:
      kernel_name:
        description: "Kernel name"
        required: true
        default: "Zixine"
        type: string
      kernel_branch:
        description: "Kernel branch"
        required: true
        default: "android12-5.10"
        type: string
      ksuversion:
        description: "KernelSU branch"
        required: true
        default: "xxksu"
        type: string
      hz:
        description: "Kernel HZ"
        required: true
        default: "500"
        type: choice
        options:
          - "250"
          - "300"
          - "500"
          - "1000"

jobs:
  build:
    name: Build GKI ARM64
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    env:
      KERNEL_REPO: https://github.com/ramabondanp/android_kernel_common-5.10
      KSU_REPO: https://github.com/RapliVx/KernelSU
      KERNEL_DIR: ${{ github.workspace }}/kernel
      OUT_DIR: ${{ github.workspace }}/out
      DIST_DIR: ${{ github.workspace }}/dist

    steps:
      - name: Free runner storage
        run: |
          set -e
          df -h
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo rm -rf /usr/local/share/powershell /usr/local/share/chromium
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y             git curl wget bc bison flex build-essential             clang llvm lld gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu             zip unzip rsync cpio libssl-dev libelf-dev pahole             python3 python3-pip python3-dev lz4 zstd ccache

      - name: Check LLVM toolchain
        run: |
          set -e
          clang --version
          llvm-as --version
          ld.lld --version
          aarch64-linux-gnu-gcc --version

      - name: Setup 8GB swap
        run: |
          set -e
          echo "=== MEMORY BEFORE ==="
          free -h
          if ! swapon --show | grep -q "/swapfile"; then
            sudo fallocate -l 8G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          fi
          echo "=== MEMORY AFTER ==="
          free -h
          swapon --show

      - name: Clone kernel source
        run: |
          set -e
          git clone --depth=1 --branch "${{ inputs.kernel_branch }}"             "${KERNEL_REPO}" "${KERNEL_DIR}"
          cd "${KERNEL_DIR}"
          git log -1 --oneline
          git branch --show-current
          test -f Makefile
          test -f arch/arm64/configs/gki_defconfig

      - name: Install MamboSU KernelSU
        run: |
          set -e
          cd "${KERNEL_DIR}"
          curl -LSs             "https://raw.githubusercontent.com/RapliVx/KernelSU/xxksu/kernel/setup.sh"             | bash -s xxksu
          if [ -d drivers/kernelsu ]; then
            echo "KernelSU installed: drivers/kernelsu"
          elif [ -d KernelSU ]; then
            echo "KernelSU installed: KernelSU"
          else
            echo "ERROR: KernelSU was not installed"
            exit 1
          fi

      - name: Configure GKI
        run: |
          set -e
          cd "${KERNEL_DIR}"
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1

          mkdir -p "${OUT_DIR}" "${DIST_DIR}"

          # Avoid the missing gki_defconfig target:
          # use the actual defconfig file directly.
          cp arch/arm64/configs/gki_defconfig "${OUT_DIR}/.config"

          ./scripts/config             --file "${OUT_DIR}/.config"             --enable CONFIG_KPROBES             --enable CONFIG_KRETPROBES             --enable CONFIG_HAVE_SYSCALL_TRACEPOINTS

          case "${{ inputs.hz }}" in
            250)
              ./scripts/config --file "${OUT_DIR}/.config"                 --enable CONFIG_HZ_250 --set-val CONFIG_HZ 250 ;;
            300)
              ./scripts/config --file "${OUT_DIR}/.config"                 --enable CONFIG_HZ_300 --set-val CONFIG_HZ 300 ;;
            500)
              ./scripts/config --file "${OUT_DIR}/.config"                 --enable CONFIG_HZ_500 --set-val CONFIG_HZ 500 ;;
            1000)
              ./scripts/config --file "${OUT_DIR}/.config"                 --enable CONFIG_HZ_1000 --set-val CONFIG_HZ 1000 ;;
            *)
              echo "Invalid HZ"
              exit 1 ;;
          esac

          make O="${OUT_DIR}" ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

          echo "=== FINAL CONFIG ==="
          grep -E '^CONFIG_HZ(_250|_300|_500|_1000)?=|^CONFIG_KPROBES=|^CONFIG_KRETPROBES=|^CONFIG_HAVE_SYSCALL_TRACEPOINTS=|^CONFIG_KSU'             "${OUT_DIR}/.config" || true

      - name: Build GKI kernel
        run: |
          set -e
          cd "${KERNEL_DIR}"
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1

          echo "========================================"
          echo "       STARTING GKI KERNEL BUILD"
          echo "========================================"
          echo "Kernel : ${{ inputs.kernel_name }}"
          echo "Branch : ${{ inputs.kernel_branch }}"
          echo "KSU    : ${{ inputs.ksuversion }}"
          echo "HZ     : ${{ inputs.hz }}"
          echo "JOBS   : 2"
          free -h
          df -h

          make -j2             O="${OUT_DIR}"             ARCH=arm64             LLVM=1             LLVM_IAS=1             KCFLAGS="-Wno-error"

          test -f "${OUT_DIR}/vmlinux"
          test -f "${OUT_DIR}/arch/arm64/boot/Image"

      - name: Collect kernel output
        run: |
          set -e
          cd "${KERNEL_DIR}"
          rm -rf "${DIST_DIR}"
          mkdir -p "${DIST_DIR}"

          cp "${OUT_DIR}/arch/arm64/boot/Image" "${DIST_DIR}/Image"
          lz4 -f "${OUT_DIR}/arch/arm64/boot/Image" "${DIST_DIR}/Image.lz4"
          cp "${OUT_DIR}/vmlinux" "${DIST_DIR}/vmlinux"
          cp "${OUT_DIR}/.config" "${DIST_DIR}/config"

          [ -f "${OUT_DIR}/System.map" ] && cp "${OUT_DIR}/System.map" "${DIST_DIR}/System.map" || true

          if [ -d "${OUT_DIR}/arch/arm64/boot/dts" ]; then
            mkdir -p "${DIST_DIR}/dtbs"
            find "${OUT_DIR}/arch/arm64/boot/dts" -type f -name "*.dtb"               -exec cp --parents {} "${DIST_DIR}/dtbs/" \; || true
          fi

          mkdir -p "${DIST_DIR}/modules"
          make O="${OUT_DIR}" ARCH=arm64             INSTALL_MOD_PATH="${DIST_DIR}/modules" modules_install || true

          find "${DIST_DIR}" -type f -printf "%p\n" | sort

      - name: Verify kernel output
        run: |
          set -e
          test -f "${DIST_DIR}/Image"
          test -f "${DIST_DIR}/Image.lz4"
          test -f "${DIST_DIR}/vmlinux"
          test -f "${DIST_DIR}/config"
          file "${DIST_DIR}/Image" "${DIST_DIR}/Image.lz4" "${DIST_DIR}/vmlinux"
          ls -lh "${DIST_DIR}/Image" "${DIST_DIR}/Image.lz4"             "${DIST_DIR}/vmlinux" "${DIST_DIR}/config"

      - name: Package kernel
        run: |
          set -e
          DATE=$(date +"%Y%m%d-%H%M")
          ZIP_NAME="${{ inputs.kernel_name }}-GKI-5.10-MamboSU-${DATE}.zip"

          rm -rf release
          mkdir -p release
          cp -a "${DIST_DIR}/." release/

          cat > release/BUILD_INFO.txt <<EOF
          Kernel Name       : ${{ inputs.kernel_name }}
          Kernel Repository : ${KERNEL_REPO}
          Kernel Branch     : ${{ inputs.kernel_branch }}
          KernelSU Repo     : ${KSU_REPO}
          KernelSU Branch   : ${{ inputs.ksuversion }}
          Architecture      : arm64
          Kernel HZ         : ${{ inputs.hz }}
          Build Jobs        : 2
          GitHub Run        : ${GITHUB_RUN_NUMBER}
          GitHub SHA        : ${GITHUB_SHA}
          Kernel Commit     : $(cd "${KERNEL_DIR}" && git rev-parse HEAD)
          Build Date UTC    : $(date -u)
          EOF

          cd release
          zip -9 -r "../${ZIP_NAME}" .
          cd ..
          echo "PACKAGE=${ZIP_NAME}" >> "${GITHUB_ENV}"
          ls -lh "${ZIP_NAME}"

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.kernel_name }}-GKI-5.10-MamboSU
          path: |
            ${{ env.PACKAGE }}
            ${{ env.DIST_DIR }}/**
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "GKI-5.10-${{ github.run_number }}"
          name: "${{ inputs.kernel_name }} GKI 5.10 MamboSU #${{ github.run_number }}"
          body: |
            ## ${{ inputs.kernel_name }} GKI 5.10

            ### Kernel
            - Source: ramabondanp/android_kernel_common-5.10
            - Branch: `${{ inputs.kernel_branch }}`
            - Architecture: ARM64

            ### Root
            - KernelSU fork: RapliVx/KernelSU
            - Branch: `${{ inputs.ksuversion }}`
            - MamboSU support: enabled

            ### Configuration
            - CONFIG_HZ: `${{ inputs.hz }}`
            - LLVM/Clang
            - Build parallelism: 2
            - 8GB swap

            ### Build
            - GitHub Run: `${{ github.run_number }}`
            - Commit: `${{ github.sha }}`

            > GKI kernel output. Device-specific boot/vendor_boot integration
            > may still be required for the target device.

          files: |
            ${{ env.PACKAGE }}
          fail_on_unmatched_files: true
          generate_release_notes: true
